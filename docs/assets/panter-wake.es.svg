<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="pwes-title pwes-desc">
  <title id="pwes-title">Cómo despierta Panter-ai a cada trabajador</title>
  <desc id="pwes-desc">Diagrama. Panter tiene trabajo en cola y avisa a cada trabajador por la ruta que soporta su app: los hosts de ChatGPT (GPT-A y GPT-B) por una suscripción a eventos MCP que dispara una automatización de ChatGPT Work; Grok por un webhook con token a su Grok Bot Routine; Claude por una Claude Code Routine; Gemini por un relay de Gmail o una tarea programada, nunca para escritores ni misiones sensibles; y cualquier host con un chat abierto por una escucha MCP en vivo. Un aviso aceptado no prueba que hubo trabajo: solo cuenta el claim del trabajador.</desc>
  <defs>
    <marker id="pwes-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2dd4bf"/></marker>
    <marker id="pwes-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f5b301"/></marker>
    <marker id="pwes-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b5"/></marker>
    <radialGradient id="pwes-halo"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".35" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="pwes-haloa"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".35" stop-color="#f5b301" stop-opacity=".6"/><stop offset="1" stop-color="#f5b301" stop-opacity="0"/></radialGradient>
    <style>@media (prefers-reduced-motion: reduce){.pkt{display:none}}</style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0d1117"/>
  <rect x="40" y="190" width="270" height="140" rx="18" fill="#111722" stroke="#f5b301" stroke-width="2"/>
  <text x="64" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f0e6">Trabajo en cola</text>
  <text x="64" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa3b5">durable, con su permiso,</text>
  <text x="64" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa3b5">esperando que lo tomen</text>
  <rect x="470" y="40" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">GPT-A, GPT-B (ChatGPT)</text>
  <text x="490" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">una automatización de ChatGPT Work abre el chat</text>
  <rect x="850" y="55" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">suscripción a eventos MCP</text>
  <path d="M 312 260 C 390 260, 390 77, 462 77" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwes-arrow-teal)"/>
  <rect x="470" y="130" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Grok</text>
  <text x="490" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">la Grok Bot Routine toma el trabajo</text>
  <rect x="850" y="145" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">webhook con token</text>
  <path d="M 312 260 C 390 260, 390 167, 462 167" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwes-arrow-teal)"/>
  <rect x="470" y="220" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Claude</text>
  <text x="490" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">una ejecución de la rutina abre una sesión</text>
  <rect x="850" y="235" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">Claude Code Routine</text>
  <path d="M 312 260 C 390 260, 390 257, 462 257" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwes-arrow-teal)"/>
  <rect x="470" y="310" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Gemini</text>
  <text x="490" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">nunca escritores ni misiones sensibles</text>
  <rect x="850" y="325" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">relay de Gmail o tarea programada</text>
  <path d="M 312 260 C 390 260, 390 347, 462 347" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwes-arrow-teal)"/>
  <rect x="470" y="400" width="690" height="74" rx="12" fill="#161b26" stroke="#2a3142" stroke-width="2"/>
  <text x="490" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Cualquier host con chat abierto</text>
  <text x="490" y="454" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">long poll: retoma apenas llega trabajo</text>
  <rect x="850" y="415" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#9aa3b5">escucha MCP en vivo</text>
  <path d="M 312 260 C 390 260, 390 437, 462 437" fill="none" stroke="#9aa3b5" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#pwes-arrow-muted)"/>
  <text x="390" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9aa3b5">avisa</text>
  <rect x="40" y="496" width="1120" height="44" rx="12" fill="#111722" stroke="#2a3142" stroke-width="2"/>
  <text x="600" y="523" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#9aa3b5">Que el host acepte el aviso no prueba que trabajó. Panter solo confía en el claim del trabajador y en su resultado.</text>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwes-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 77, 462 77" keyPoints="0;1;1" keyTimes="0;0.2800;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0084;0.2716;0.2800;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwes-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 167, 462 167" keyPoints="0;0;1;1" keyTimes="0;0.1100;0.3900;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1100;0.1184;0.3816;0.3900;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwes-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 257, 462 257" keyPoints="0;0;1;1" keyTimes="0;0.2200;0.5000;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2200;0.2284;0.4916;0.5000;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwes-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 347, 462 347" keyPoints="0;0;1;1" keyTimes="0;0.3300;0.6100;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3300;0.3384;0.6016;0.6100;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwes-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 437, 462 437" keyPoints="0;0;1;1" keyTimes="0;0.4400;0.7200;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4400;0.4484;0.7116;0.7200;1" dur="5s" repeatCount="indefinite"/></g>
</svg>
