<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="pwen-title pwen-desc">
  <title id="pwen-title">How Panter-ai wakes each worker</title>
  <desc id="pwen-desc">Diagram. Panter has queued work and rings each worker through the route its app supports: ChatGPT hosts (GPT-A and GPT-B) through an MCP event subscription that triggers a ChatGPT Work automation; Grok through a bearer webhook to its Grok Bot Routine; Claude through a Claude Code Routine; Gemini through a Gmail relay or a scheduled task, never for writers or sensitive missions; and any host with a chat open through a live MCP listener. An accepted ring is not proof of work: only the worker&#x27;s claim counts.</desc>
  <defs>
    <marker id="pwen-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2dd4bf"/></marker>
    <marker id="pwen-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f5b301"/></marker>
    <marker id="pwen-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b5"/></marker>
    <radialGradient id="pwen-halo"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".35" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="pwen-haloa"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".35" stop-color="#f5b301" stop-opacity=".6"/><stop offset="1" stop-color="#f5b301" stop-opacity="0"/></radialGradient>
    <style>@media (prefers-reduced-motion: reduce){.pkt{display:none}}</style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0d1117"/>
  <rect x="40" y="190" width="270" height="140" rx="18" fill="#111722" stroke="#f5b301" stroke-width="2"/>
  <text x="64" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f0e6">Work queued</text>
  <text x="64" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa3b5">durable, with its grant,</text>
  <text x="64" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa3b5">waiting for a claim</text>
  <rect x="470" y="40" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">GPT-A, GPT-B (ChatGPT)</text>
  <text x="490" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">a ChatGPT Work automation wakes the chat</text>
  <rect x="850" y="55" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">MCP event subscription</text>
  <path d="M 312 260 C 390 260, 390 77, 462 77" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwen-arrow-teal)"/>
  <rect x="470" y="130" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Grok</text>
  <text x="490" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">the Grok Bot Routine picks the work up</text>
  <rect x="850" y="145" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">bearer webhook</text>
  <path d="M 312 260 C 390 260, 390 167, 462 167" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwen-arrow-teal)"/>
  <rect x="470" y="220" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Claude</text>
  <text x="490" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">a routine run starts a session</text>
  <rect x="850" y="235" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">Claude Code Routine</text>
  <path d="M 312 260 C 390 260, 390 257, 462 257" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwen-arrow-teal)"/>
  <rect x="470" y="310" width="690" height="74" rx="12" fill="#161b26" stroke="#2dd4bf" stroke-width="2"/>
  <text x="490" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Gemini</text>
  <text x="490" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">never writers or sensitive missions</text>
  <rect x="850" y="325" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">Gmail relay or scheduled task</text>
  <path d="M 312 260 C 390 260, 390 347, 462 347" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#pwen-arrow-teal)"/>
  <rect x="470" y="400" width="690" height="74" rx="12" fill="#161b26" stroke="#2a3142" stroke-width="2"/>
  <text x="490" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f5f0e6">Any host with a chat open</text>
  <text x="490" y="454" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa3b5">long poll: resumes as soon as work arrives</text>
  <rect x="850" y="415" width="290" height="44" rx="22" fill="#0d1117" stroke="#2a3142" stroke-width="1.5"/>
  <text x="995" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#9aa3b5">live MCP listener</text>
  <path d="M 312 260 C 390 260, 390 437, 462 437" fill="none" stroke="#9aa3b5" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#pwen-arrow-muted)"/>
  <text x="390" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9aa3b5">rings</text>
  <rect x="40" y="496" width="1120" height="44" rx="12" fill="#111722" stroke="#2a3142" stroke-width="2"/>
  <text x="600" y="523" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#9aa3b5">A ring the host accepted is not proof of work. Panter only trusts the worker&#x27;s claim and its result.</text>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwen-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 77, 462 77" keyPoints="0;1;1" keyTimes="0;0.2800;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0084;0.2716;0.2800;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwen-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 167, 462 167" keyPoints="0;0;1;1" keyTimes="0;0.1100;0.3900;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1100;0.1184;0.3816;0.3900;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwen-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 257, 462 257" keyPoints="0;0;1;1" keyTimes="0;0.2200;0.5000;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2200;0.2284;0.4916;0.5000;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwen-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 347, 462 347" keyPoints="0;0;1;1" keyTimes="0;0.3300;0.6100;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3300;0.3384;0.6016;0.6100;1" dur="5s" repeatCount="indefinite"/></g>
  <g class="pkt" opacity="0"><circle r="11" fill="url(#pwen-halo)"/><circle r="3.5" fill="#ffffff"/><animateMotion path="M 312 260 C 390 260, 390 437, 462 437" keyPoints="0;0;1;1" keyTimes="0;0.4400;0.7200;1" calcMode="linear" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4400;0.4484;0.7116;0.7200;1" dur="5s" repeatCount="indefinite"/></g>
</svg>
