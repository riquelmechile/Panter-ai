name: Feature request
description: Propose a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why it is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want. Say which role gets it (leader or worker) and whether it changes any permission.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How we would verify it
      description: A test, a smoke command or an end-to-end run that would prove it works. CONTRIBUTING.md asks for this before a major feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
