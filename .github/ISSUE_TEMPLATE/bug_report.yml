name: Bug report
description: Something in Panter-ai does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do **not** go here: use **Security → Report a vulnerability**.
        Never paste tokens, passwords, OAuth secrets or `panter.env` contents. Use placeholders.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of tool calls, commands or requests that shows the problem.
      placeholder: |
        1. Leader calls panter_mesh_delegate with role "implementer" ...
        2. Worker grok calls panter_mesh_claim ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From `/health` or `git rev-parse --short HEAD`.
      placeholder: 1.5.0 (d39ab84)
    validations:
      required: true
  - type: dropdown
    id: owner-mode
    attributes:
      label: Owner mode
      options:
        - "On (PANTER_OWNER_MODE=1)"
        - "Off"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: hosts
    attributes:
      label: Hosts involved
      multiple: true
      options: [claude, gpt-a, gpt-b, grok, gemini, "a downstream MCP server", "none / server only"]
  - type: textarea
    id: logs
    attributes:
      label: Logs or tool output
      description: Redact secrets, domains and account names first.
      render: text
