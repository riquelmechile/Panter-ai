name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run smoke:http
      - run: npm run smoke:oauth
      - run: npm run smoke:embedded
  arm64-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build Oracle ARM64 image without publishing
        run: docker buildx build --platform linux/arm64 --load -t panter-ai:arm64-ci .
      - name: Verify ARM64 container starts
        run: docker run --rm --platform linux/arm64 panter-ai:arm64-ci node --version
