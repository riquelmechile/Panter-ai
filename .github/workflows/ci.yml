name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run smoke:http
      - run: npm run smoke:oauth
      - run: npm run smoke:embedded
  arm64-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build Oracle ARM64 image without publishing
        run: docker buildx build --platform linux/arm64 --load -t panter-ai:arm64-ci .
      - name: Verify actual ARM64 Panter OAuth HTTP startup and unauthorized MCP
        run: |
          set -eu
          docker run --rm -d --name panter-arm64-ci --platform linux/arm64 \
            -p 127.0.0.1:18089:8080 \
            -e PANTER_AUTH_MODE=embedded \
            -e PANTER_PUBLIC_MCP_URL=https://panter.example.org/mcp \
            -e PANTER_OAUTH_REDIRECT_URIS=https://chatgpt.com/connector_platform_oauth_redirect \
            -e PANTER_CONSENT_PASSWORD=ci-only-random-private-password-32-characters \
            -e PANTER_ALLOWED_HOSTS=127.0.0.1,localhost \
            panter-ai:arm64-ci
          trap 'docker logs panter-arm64-ci || true; docker stop panter-arm64-ci || true' EXIT
          good=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18089/health | grep -q 'panter-ai'; then good=1; break; fi
            sleep 1
          done
          test "$good" -eq 1
          status=$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18089/mcp)
          test "$status" = "401"

